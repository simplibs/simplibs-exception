[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "simplibs-exception"
version = "1.0.0"
description = "A structured Python exception with diagnostic output and actionable remediation hints."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
keywords = [
    "exception",
    "error",
    "debugging",
    "diagnostics",
    "simplibs",
    "developer-tools",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Debuggers",
]
dependencies = [
    "simplibs-sentinels>=0.1.0",
]

[[project.authors]]
name = "Dalibor Sova (Sudip2708)"
email = "daliborsova@seznam.cz"

[project.urls]
Homepage = "https://github.com/simplibs/simplibs-exception"
Repository = "https://github.com/simplibs/simplibs-exception"
Issues = "https://github.com/simplibs/simplibs-exception/issues"
Changelog = "https://github.com/simplibs/simplibs-exception/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v"

[tool.setuptools.packages.find]
where = ["src"]